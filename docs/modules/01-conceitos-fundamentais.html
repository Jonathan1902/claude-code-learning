    <script>
        const topics = {"1": {"title": "01-O-QUE-E-CLAUDE-CODE", "html": "<h1>O que \u00e9 Claude Code?</h1>\n<blockquote><strong>Para quem \u00e9 este t\u00f3pico:</strong> qualquer pessoa que queira entender o que o Claude Code faz \u2014 n\u00e3o exige saber programar.</blockquote>\n<p>></p>\n<blockquote><strong>Ao terminar voc\u00ea ser\u00e1 capaz de:</strong></blockquote>\n<blockquote>- Explicar o que \u00e9 Claude Code em uma frase</blockquote>\n<blockquote>- Diferenciar Claude Code, Chat Web e API Anthropic</blockquote>\n<blockquote>- Decidir se Claude Code resolve o seu caso</blockquote>\n<blockquote>\ud83d\udca1 <em>Imagine um colega que l\u00ea seus arquivos, edita c\u00f3digo, roda comandos no terminal e explica o que fez \u2014 sem voc\u00ea precisar copiar e colar nada. Esse \u00e9 o Claude Code.</em></blockquote>\n<h2>Defini\u00e7\u00e3o</h2>\n<p>Claude Code \u00e9 uma <strong>ferramenta CLI e IDE extension</strong> desenvolvida pela Anthropic que integra o modelo Claude diretamente no fluxo de trabalho do desenvolvedor. Diferente do chat web tradicional, Claude Code foi otimizado para <strong>leitura e manipula\u00e7\u00e3o de c\u00f3digo</strong>, com suporte a tool use integrado.</p>\n<blockquote>\ud83d\udcd6 <strong>Gloss\u00e1rio r\u00e1pido:</strong></blockquote>\n<blockquote>- <strong>CLI</strong> = Command Line Interface \u2014 a interface por linha de comando (o \"terminal preto\").</blockquote>\n<blockquote>- <strong>IDE extension</strong> = plugin que roda dentro do editor (VS Code, JetBrains, etc.).</blockquote>\n<blockquote>- <strong>Tool use</strong> = ver o gloss\u00e1rio na se\u00e7\u00e3o \"Componentes Principais\" abaixo.</blockquote>\n<h2>Claude Code vs Chat Web</h2>\n<p>| Aspecto | Claude Code | Chat Web |</p>\n<p>|---|---|---|</p>\n<p>| <strong>Interface</strong> | CLI / IDE Extension / Web App | Browser |</p>\n<p>| <strong>Tool Use</strong> | Nativo (l\u00ea, edita, executa comandos) | Limitado |</p>\n<p>| <strong>Contexto de C\u00f3digo</strong> | Acesso direto a arquivos | Copy-paste manual |</p>\n<p>| <strong>Velocidade</strong> | Itera\u00e7\u00e3o r\u00e1pida | Mais lento |</p>\n<p>| <strong>Persist\u00eancia</strong> | Mem\u00f3ria na sess\u00e3o atual | N\u00e3o persiste contexto |</p>\n<h2>Claude Code vs API Anthropic</h2>\n<h3>Claude Code (Interface)</h3>\n<ul>\n<li>\u2705 Itera\u00e7\u00e3o interativa</li>\n<li>\u2705 Acesso direto a arquivos</li>\n<li>\u2705 Tool use autom\u00e1tico</li>\n<li>\u274c N\u00e3o \u00e9 program\u00e1tico</li>\n<li>\u274c Modelo selecion\u00e1vel via interface</li>\n</ul>\n<h3>Anthropic API (Program\u00e1tico)</h3>\n<ul>\n<li>\u2705 Integra\u00e7\u00e3o em aplica\u00e7\u00f5es</li>\n<li>\u2705 Controle total do programa</li>\n<li>\u2705 Batch processing</li>\n<li>\u274c Requer c\u00f3digo</li>\n<li>\u274c Sem interface visual</li>\n</ul>\n<h2>Componentes Principais</h2>\n<h3>1. **Agente Claude**</h3>\n<p>O modelo base que processa prompts e decide como usar ferramentas.</p>\n<h3>2. **Tool Use**</h3>\n<blockquote>\ud83d\udcd6 <em>Tool Use = capacidade do modelo de executar a\u00e7\u00f5es reais (ler arquivo, editar, rodar comando) e n\u00e3o s\u00f3 devolver texto. \u00c9 o que torna o Claude Code \u00fatil dentro do projeto.</em></blockquote>\n<p>Claude Code pode:</p>\n<ul>\n<li>\ud83d\udcd6 Ler arquivos (`Read`)</li>\n<li>\u270f\ufe0f Editar arquivos (`Edit`)</li>\n<li>\ud83d\udd0d Buscar padr\u00f5es (`Bash` com grep)</li>\n<li>\u2699\ufe0f Executar comandos (`Bash`)</li>\n<li>\ud83c\udf10 Buscar na web (`WebSearch`, `WebFetch`)</li>\n<li>\ud83d\udcdd Escrever arquivos (`Write`)</li>\n</ul>\n<h3>3. **MCP Servers**</h3>\n<blockquote>\ud83d\udcd6 <em>MCP = Model Context Protocol \u2014 uma esp\u00e9cie de \"plugin\" que conecta o Claude a sistemas externos (Gmail, Drive, banco de dados, APIs internas).</em></blockquote>\n<p>Integra\u00e7\u00e3o com servidores Model Context Protocol para expandir capacidades.</p>\n<h3>4. **Hooks**</h3>\n<blockquote>\ud83d\udcd6 <em>Hook = script autom\u00e1tico que dispara em resposta a um evento (antes de um commit, depois de uma resposta do Claude, ao parar a sess\u00e3o).</em></blockquote>\n<p>Scripts executados automaticamente em eventos (pr\u00e9-commit, p\u00f3s-resposta, etc).</p>\n<h3>5. **CLAUDE.md**</h3>\n<p>Arquivo de configura\u00e7\u00e3o que documenta padr\u00f5es, decis\u00f5es e contexto do projeto.</p>\n<h2>Fluxo B\u00e1sico</h2>\n<pre><code>\nUsu\u00e1rio \u2192 Prompt \u2192 Claude Code \u2192 Tool Use \u2192 Resultado \u2192 Resposta Iterativa\n</code></pre>\n<p>1. <strong>Usu\u00e1rio</strong> d\u00e1 instru\u00e7\u00e3o em linguagem natural</p>\n<p>2. <strong>Claude Code</strong> l\u00ea contexto (arquivos, projeto)</p>\n<p>3. <strong>Agente Claude</strong> decide quais ferramentas usar</p>\n<p>4. <strong>Tool Use</strong> executa (edita arquivo, roda teste, etc)</p>\n<p>5. <strong>Resultado</strong> \u00e9 processado e explicado ao usu\u00e1rio</p>\n<h3>Exemplo concreto</h3>\n<blockquote><strong>Voc\u00ea:</strong> Corrija o bug de timezone em `src/dates.py`.</blockquote>\n<p>></p>\n<blockquote><strong>Claude Code:</strong></blockquote>\n<blockquote>1. <em>(usa `Read` em `src/dates.py`)</em></blockquote>\n<blockquote>2. <em>(detecta `datetime.now()` sem timezone na linha 42)</em></blockquote>\n<blockquote>3. <em>(aplica `Edit` substituindo por `datetime.now(timezone.utc)`)</em></blockquote>\n<p>></p>\n<blockquote><em>\"Encontrei e corrigi o bug na linha 42 \u2014 o `datetime.now()` estava sem timezone, o que causava hor\u00e1rios inconsistentes entre servidores. Quer que eu rode os testes?\"</em></blockquote>\n<p>Repare em tr\u00eas coisas: voc\u00ea falou em linguagem natural; o Claude <strong>escolheu sozinho</strong> quais ferramentas usar (`Read` + `Edit`); e a resposta final explica o que mudou e prop\u00f5e o pr\u00f3ximo passo.</p>\n<h2>Quando Usar Claude Code</h2>\n<ul>\n<li>\u2705 Debugging e investiga\u00e7\u00e3o de c\u00f3digo</li>\n<li>\u2705 Refatora\u00e7\u00e3o de arquivos</li>\n<li>\u2705 Gera\u00e7\u00e3o de documenta\u00e7\u00e3o</li>\n<li>\u2705 An\u00e1lise de performance</li>\n<li>\u2705 Automa\u00e7\u00e3o DevOps</li>\n<li>\u2705 Processamento de dados</li>\n</ul>\n<h2>Limita\u00e7\u00f5es Importantes</h2>\n<ul>\n<li>\u26a0\ufe0f <strong>Context window limitado (~200k tokens com Sonnet 4.6)</strong> \u2014 equivale a aproximadamente <strong>150 mil palavras</strong>, mais ou menos o tamanho de um livro t\u00e9cnico m\u00e9dio. Acima desse limite, o modelo come\u00e7a a \"esquecer\" o in\u00edcio da conversa.</li>\n<li>\u26a0\ufe0f <strong>Sem mem\u00f3ria entre sess\u00f5es</strong> \u2014 ao fechar o terminal, o contexto se perde. Use `CLAUDE.md` para gravar padr\u00f5es, decis\u00f5es e vocabul\u00e1rio que devem persistir entre sess\u00f5es.</li>\n<li>\u26a0\ufe0f <strong>N\u00e3o substitui revis\u00e3o humana</strong> \u2014 c\u00f3digo gerado deve ser lido, testado e validado antes de ir para produ\u00e7\u00e3o, principalmente em mudan\u00e7as sens\u00edveis (seguran\u00e7a, migra\u00e7\u00f5es de banco, deploys).</li>\n<li>\u26a0\ufe0f <strong>Custo por token</strong> \u2014 uso intensivo pode chegar a alguns d\u00f3lares por hora; para uso ocasional o impacto \u00e9 desprez\u00edvel, mas em times grandes ou pipelines automatizados vale monitorar.</li>\n</ul>\n<p>---</p>\n<p><strong>Pr\u00f3ximo</strong>: <a href=\"02-CASOS-DE-USO.md\">Casos de Uso Pr\u00e1ticos</a></p>"}, "2": {"title": "02-CASOS-DE-USO", "html": "<h1>Casos de Uso Pr\u00e1ticos</h1>\n<h2>1. Debugging e Investiga\u00e7\u00e3o</h2>\n<h3>Cen\u00e1rio</h3>\n<p>Aplica\u00e7\u00e3o Python com erro em runtime.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Tenho este stack trace. Qual \u00e9 a raiz do problema?\"\n[fornecer stack trace + arquivo relevante]\n</code></pre>\n<p><strong>Resultado</strong>: Claude l\u00ea o arquivo, analisa o stack trace e identifica o bug.</p>\n<p>---</p>\n<h2>2. Refatora\u00e7\u00e3o de C\u00f3digo</h2>\n<h3>Cen\u00e1rio</h3>\n<p>M\u00e9todo muito longo que precisa ser dividido.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Refatore este arquivo para melhorar legibilidade\"\n</code></pre>\n<p><strong>Resultado</strong>: Claude Code edita o arquivo automaticamente e explica as mudan\u00e7as.</p>\n<p>---</p>\n<h2>3. Gera\u00e7\u00e3o de Documenta\u00e7\u00e3o</h2>\n<h3>Cen\u00e1rio</h3>\n<p>C\u00f3digo sem docstrings ou README.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Adicione docstrings em todos os m\u00e9todos e escreva um README\"\n</code></pre>\n<p><strong>Resultado</strong>: Arquivos s\u00e3o atualizados com documenta\u00e7\u00e3o completa.</p>\n<p>---</p>\n<h2>4. An\u00e1lise de Performance</h2>\n<h3>Cen\u00e1rio</h3>\n<p>Script Python rodando lentamente.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Execute com profiling e me mostre onde est\u00e1 o bottleneck\"\n</code></pre>\n<p><strong>Resultado</strong>: </p>\n<ul>\n<li>Claude roda profiler</li>\n<li>Identifica fun\u00e7\u00f5es lentas</li>\n<li>Sugere otimiza\u00e7\u00f5es espec\u00edficas</li>\n</ul>\n<p>---</p>\n<h2>5. Testes Automatizados</h2>\n<h3>Cen\u00e1rio</h3>\n<p>Novo m\u00f3dulo sem cobertura de testes.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Escreva testes completos para este m\u00f3dulo\"\n</code></pre>\n<p><strong>Resultado</strong>: Suite de testes \u00e9 gerada com m\u00faltiplos casos.</p>\n<p>---</p>\n<h2>6. Automa\u00e7\u00e3o DevOps</h2>\n<h3>Cen\u00e1rio</h3>\n<p>Deploy repetitivo e propenso a erro.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Crie um script de deploy automatizado\"\n</code></pre>\n<p><strong>Resultado</strong>: Script shell ou Python \u00e9 gerado e testado.</p>\n<p>---</p>\n<h2>7. Processamento de Dados</h2>\n<h3>Cen\u00e1rio</h3>\n<p>CSV grande que precisa ser transformado.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Leia este CSV e transforme conforme o padr\u00e3o especificado\"\n</code></pre>\n<p><strong>Resultado</strong>: Script de ETL \u00e9 gerado e executado.</p>\n<p>---</p>\n<h2>8. An\u00e1lise de C\u00f3digo Existente</h2>\n<h3>Cen\u00e1rio</h3>\n<p>Projeto legado que ningu\u00e9m entende.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Me explique como este fluxo de autentica\u00e7\u00e3o funciona\"\n</code></pre>\n<p><strong>Resultado</strong>: Explica\u00e7\u00e3o detalhada com diagramas ASCII.</p>\n<p>---</p>\n<h2>9. Seguran\u00e7a</h2>\n<h3>Cen\u00e1rio</h3>\n<p>Verificar se h\u00e1 vulnerabilidades conhecidas.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Analise este c\u00f3digo para vulnerabilidades de seguran\u00e7a\"\n</code></pre>\n<p><strong>Resultado</strong>: An\u00e1lise de OWASP Top 10, inputs validation, etc.</p>\n<p>---</p>\n<h2>10. Migra\u00e7\u00f5es de Tecnologia</h2>\n<h3>Cen\u00e1rio</h3>\n<p>Atualizar Django 3.x para 4.x.</p>\n<h3>Como Usar Claude Code</h3>\n<pre><code>\n\"Migre este projeto para Django 4.x respeitando as breaking changes\"\n</code></pre>\n<p><strong>Resultado</strong>: C\u00f3digo atualizado com compatibilidade.</p>\n<p>---</p>\n<p><strong>Pr\u00f3ximo</strong>: <a href=\"03-QUANDO-USAR.md\">Quando Usar Claude Code</a></p>"}, "3": {"title": "03-QUANDO-USAR", "html": "<h1>Quando Usar Claude Code</h1>\n<h2>Crit\u00e9rios de Decis\u00e3o</h2>\n<h3>\u2705 USE Claude Code quando:</h3>\n<p>#### 1. Voc\u00ea tem c\u00f3digo para analisar</p>\n<ul>\n<li>Arquivo aberto no editor</li>\n<li>Erro espec\u00edfico com stack trace</li>\n<li>Precisa entender fluxo complexo</li>\n</ul>\n<p><strong>Exemplo</strong>: \"Por que este teste est\u00e1 falhando?\" + arquivo de teste</p>\n<p>---</p>\n<p>#### 2. Tarefa requer itera\u00e7\u00e3o</p>\n<ul>\n<li>N\u00e3o \u00e9 um prompt \u00fanico</li>\n<li>Voc\u00ea vai refinar e testar v\u00e1rias vezes</li>\n<li>Feedback cont\u00ednuo \u00e9 necess\u00e1rio</li>\n</ul>\n<p><strong>Exemplo</strong>: Refatora\u00e7\u00e3o com testes depois</p>\n<p>---</p>\n<p>#### 3. C\u00f3digo precisa ser modificado</p>\n<ul>\n<li>Editar m\u00faltiplos arquivos</li>\n<li>Aplicar padr\u00e3o em v\u00e1rios locais</li>\n<li>Atualizar automaticamente</li>\n</ul>\n<p><strong>Exemplo</strong>: Adicionar logging em 20 fun\u00e7\u00f5es</p>\n<p>---</p>\n<p>#### 4. Automa\u00e7\u00e3o de tarefas repetitivas</p>\n<ul>\n<li>Deploy scripts</li>\n<li>Data processing</li>\n<li>Batch operations</li>\n</ul>\n<p><strong>Exemplo</strong>: ETL que precisa rodar toda semana</p>\n<p>---</p>\n<p>#### 5. Contexto de projeto importa</p>\n<ul>\n<li>Arquivos relacionados</li>\n<li>Conven\u00e7\u00f5es espec\u00edficas</li>\n<li>Hist\u00f3rico de decis\u00f5es</li>\n</ul>\n<p><strong>Exemplo</strong>: \"Refatore seguindo o padr\u00e3o do projeto\"</p>\n<p>---</p>\n<h3>\u274c EVITE Claude Code quando:</h3>\n<p>#### 1. Decis\u00e3o arquitetural pura</p>\n<ul>\n<li>Qual framework escolher?</li>\n<li>SQL vs NoSQL?</li>\n<li>Monol\u00edtico vs microsservi\u00e7os?</li>\n</ul>\n<p><strong>Por qu\u00ea</strong>: Requer vis\u00e3o de neg\u00f3cio, n\u00e3o c\u00f3digo. Use discuss\u00e3o com time.</p>\n<p>---</p>\n<p>#### 2. Conhecimento espec\u00edfico de dom\u00ednio</p>\n<ul>\n<li>\"Qual \u00e9 a melhor pr\u00e1tica para MRI?\"</li>\n<li>\"Como regulamentar criptografia?\"</li>\n</ul>\n<p><strong>Por qu\u00ea</strong>: Claude n\u00e3o substitui expertise humana.</p>\n<p>---</p>\n<p>#### 3. Criatividade pura</p>\n<ul>\n<li>Conceito de produto novo</li>\n<li>Design de interface inovador</li>\n</ul>\n<p><strong>Por qu\u00ea</strong>: Criatividade requer dire\u00e7\u00e3o humana clara.</p>\n<p>---</p>\n<p>#### 4. Contexto muito grande (>100k tokens)</p>\n<ul>\n<li>Projeto inteiro</li>\n<li>Base de dados enorme</li>\n<li>Muitos arquivos relacionados</li>\n</ul>\n<p><strong>Por qu\u00ea</strong>: Context window \u00e9 limitado; prefira explora\u00e7\u00e3o seletiva.</p>\n<p>---</p>\n<p>#### 5. Modifica\u00e7\u00e3o de dados cr\u00edticos</p>\n<ul>\n<li>Banco de dados em produ\u00e7\u00e3o</li>\n<li>Deletar arquivos permanentemente</li>\n<li>Opera\u00e7\u00f5es financeiras</li>\n</ul>\n<p><strong>Por qu\u00ea</strong>: Sempre requer aprova\u00e7\u00e3o manual expl\u00edcita.</p>\n<p>---</p>\n<h2>Matriz de Decis\u00e3o</h2>\n<p>| Tipo de Tarefa | Claude Code | Chat Web | Humano |</p>\n<p>|---|---|---|---|</p>\n<p>| Debugar erro espec\u00edfico | \u2705 | \u26a0\ufe0f | \u26a0\ufe0f |</p>\n<p>| Refatorar c\u00f3digo | \u2705 | \u26a0\ufe0f | \u26a0\ufe0f |</p>\n<p>| Gerar testes | \u2705 | \u2705 | \u26a0\ufe0f |</p>\n<p>| Escolher arquitetura | \u26a0\ufe0f | \u26a0\ufe0f | \u2705 |</p>\n<p>| Escrever documenta\u00e7\u00e3o | \u2705 | \u2705 | \u26a0\ufe0f |</p>\n<p>| An\u00e1lise de seguran\u00e7a | \u2705 | \u2705 | \u2705 |</p>\n<p>| Deploy automatizado | \u2705 | \u26a0\ufe0f | \u26a0\ufe0f |</p>\n<p>| Decis\u00e3o de neg\u00f3cio | \u274c | \u26a0\ufe0f | \u2705 |</p>\n<p>---</p>\n<h2>Exemplo de Fluxo</h2>\n<p><strong>Caso</strong>: Preciso otimizar um script Python lento</p>\n<p>1. <strong>Vou usar Claude Code porque</strong>:</p>\n<p>   - \u2705 Tenho c\u00f3digo para analisar</p>\n<p>   - \u2705 Requer itera\u00e7\u00e3o (profile \u2192 fix \u2192 test)</p>\n<p>   - \u2705 Contexto espec\u00edfico importa</p>\n<p>2. <strong>Como</strong>:</p>\n<p>   ```</p>\n<p>   \"Execute este script com profiler e identifique bottlenecks\"</p>\n<p>   [fornecer arquivo]</p>\n<p>   ```</p>\n<p>3. <strong>Ent\u00e3o</strong>:</p>\n<p>   - Claude roda profiler</p>\n<p>   - Explica resultado</p>\n<p>   - Sugere otimiza\u00e7\u00f5es espec\u00edficas</p>\n<p>   - Voc\u00ea aprova ou refina</p>\n<p>---</p>\n<p><strong>Pr\u00f3ximo</strong>: <a href=\"04-LIMITACOES.md\">Limita\u00e7\u00f5es</a></p>"}, "4": {"title": "04-LIMITACOES", "html": "<h1>Limita\u00e7\u00f5es do Claude Code</h1>\n<h2>1. Context Window</h2>\n<h3>O Problema</h3>\n<p>Claude Sonnet 4.6 tem context window de <strong>200k tokens</strong> (~50k-100k linhas de c\u00f3digo).</p>\n<h3>Impacto</h3>\n<ul>\n<li>N\u00e3o consegue processar projeto inteiro simultaneamente</li>\n<li>Arquivos muito grandes podem ser truncados</li>\n<li>Resultado: an\u00e1lise incompleta</li>\n</ul>\n<h3>Solu\u00e7\u00e3o</h3>\n<pre><code>\n# \u2705 Certo: focar em arquivos espec\u00edficos\n\"Analise apenas app/views.py para este bug\"\n\n# \u274c Errado: fornecer tudo\n\"Analise todo o projeto\"\n</code></pre>\n<p>---</p>\n<h2>2. Sem Mem\u00f3ria Entre Sess\u00f5es</h2>\n<h3>O Problema</h3>\n<p>Cada sess\u00e3o \u00e9 independente. Claude n\u00e3o lembra de:</p>\n<ul>\n<li>Prompts anteriores</li>\n<li>Decis\u00f5es tomadas</li>\n<li>Contexto de projeto</li>\n</ul>\n<h3>Impacto</h3>\n<ul>\n<li>Repetir contexto a cada sess\u00e3o</li>\n<li>Inconsist\u00eancia entre sess\u00f5es</li>\n<li>Custo aumentado (repetir informa\u00e7\u00e3o)</li>\n</ul>\n<h3>Solu\u00e7\u00e3o</h3>\n<pre><code>\nCrie CLAUDE.md com:\n- Padr\u00f5es de c\u00f3digo\n- Decis\u00f5es arquiteturais\n- Conven\u00e7\u00f5es do projeto\n- Instru\u00e7\u00f5es gerais\n</code></pre>\n<p>---</p>\n<h2>3. N\u00e3o Substitui Revis\u00e3o Humana</h2>\n<h3>O Problema</h3>\n<p>Claude pode gerar c\u00f3digo:</p>\n<ul>\n<li>Sintaticamente correto mas semanticamente errado</li>\n<li>Que passa em testes mas n\u00e3o em produ\u00e7\u00e3o</li>\n<li>Com trade-offs n\u00e3o \u00f3bvios</li>\n</ul>\n<h3>Impacto</h3>\n<ul>\n<li>Bugs passam despercebidos</li>\n<li>Decis\u00f5es t\u00e9cnicas sem contexto</li>\n<li>Performance ruim</li>\n</ul>\n<h3>Solu\u00e7\u00e3o</h3>\n<pre><code>\n# Sempre:\n1. Revise o c\u00f3digo gerado\n2. Teste em ambiente n\u00e3o-produ\u00e7\u00e3o\n3. Fa\u00e7a code review com humano\n4. Valide em produ\u00e7\u00e3o gradualmente\n</code></pre>\n<p>---</p>\n<h2>4. Sem Acesso \u00e0 Internet por Padr\u00e3o</h2>\n<h3>O Problema</h3>\n<p>Claude Code n\u00e3o pode:</p>\n<ul>\n<li>Buscar informa\u00e7\u00f5es atualizadas</li>\n<li>Verificar documenta\u00e7\u00e3o online em tempo real</li>\n<li>Acessar APIs externas direto</li>\n</ul>\n<h3>Impacto</h3>\n<ul>\n<li>Conhecimento limitado a cutoff (Ago 2025)</li>\n<li>N\u00e3o sabe \u00faltima vers\u00e3o de libraries</li>\n<li>N\u00e3o pode validar contra APIs em tempo real</li>\n</ul>\n<h3>Solu\u00e7\u00e3o</h3>\n<pre><code>\n# Use WebSearch para informa\u00e7\u00e3o recente\n\"Busque a documenta\u00e7\u00e3o atual de FastAPI\"\n\n# Forne\u00e7a manualmente vers\u00f5es\n\"Estou usando PostgreSQL 15.3\"\n</code></pre>\n<p>---</p>\n<h2>5. Custo por Token</h2>\n<h3>O Problema</h3>\n<p>Cada prompt/resposta custa tokens:</p>\n<ul>\n<li>Input: ~$0.003 por 1K tokens</li>\n<li>Output: ~$0.015 por 1K tokens</li>\n</ul>\n<h3>Impacto</h3>\n<ul>\n<li>Itera\u00e7\u00f5es m\u00faltiplas = custo cumulativo</li>\n<li>Contexto grande = mais caro</li>\n<li>Uso produtivo requer estimativa</li>\n</ul>\n<h3>Solu\u00e7\u00e3o</h3>\n<pre><code>\n# \u2705 Eficiente\n- Prompts focados e concisos\n- Fornecer apenas c\u00f3digo relevante\n- Reutilizar contexto na sess\u00e3o\n\n# \u274c Ineficiente\n- Contexto desnecess\u00e1rio\n- M\u00faltiplas sess\u00f5es repetidas\n- Falta de planejamento\n</code></pre>\n<p>---</p>\n<h2>6. Erros Silenciosos</h2>\n<h3>O Problema</h3>\n<p>Claude pode:</p>\n<ul>\n<li>Interpretar mal o que voc\u00ea quer</li>\n<li>Fazer suposi\u00e7\u00e3o incorreta</li>\n<li>N\u00e3o avisar quando tem d\u00favida</li>\n</ul>\n<h3>Impacto</h3>\n<ul>\n<li>C\u00f3digo errado \u00e9 gerado</li>\n<li>Voc\u00ea n\u00e3o percebe o erro</li>\n<li>Bugs dif\u00edceis de rastrear</li>\n</ul>\n<h3>Solu\u00e7\u00e3o</h3>\n<pre><code>\n# Sempre:\n1. Revise sa\u00edda de Claude\n2. Teste c\u00f3digo antes de produ\u00e7\u00e3o\n3. Use \"Explique passo a passo\"\n4. Pe\u00e7a para Claude listar suposi\u00e7\u00f5es\n</code></pre>\n<p>---</p>\n<h2>7. Limita\u00e7\u00f5es de Tool Use</h2>\n<h3>O Problema</h3>\n<p>Claude n\u00e3o pode:</p>\n<ul>\n<li>Interagir com sistemas interativos (requer input)</li>\n<li>Realizar opera\u00e7\u00f5es de longa dura\u00e7\u00e3o (timeout)</li>\n<li>Acessar alguns tipos de arquivos (bin\u00e1rios)</li>\n</ul>\n<h3>Impacto</h3>\n<ul>\n<li>Alguns scripts requerem input manual</li>\n<li>Deploy pode timeout</li>\n<li>Imagens n\u00e3o podem ser lidas diretamente</li>\n</ul>\n<h3>Solu\u00e7\u00e3o</h3>\n<pre><code>\n# Evite:\n- Scripts interativos\n- Opera\u00e7\u00f5es que duram >5 min\n- Bin\u00e1rios complexos\n\n# Prefira:\n- Scripts automatizados\n- Dividir tarefas longas\n- Exportar dados como texto\n</code></pre>\n<p>---</p>\n<h2>8. Modelos Diferentes = Resultados Diferentes</h2>\n<h3>O Problema</h3>\n<ul>\n<li>Sonnet 4.6: Fast, bom para itera\u00e7\u00e3o, menos preciso</li>\n<li>Opus 4.7: Lento, melhor para an\u00e1lise profunda</li>\n<li>Haiku 4.5: R\u00e1pido, menos capacidade</li>\n</ul>\n<h3>Impacto</h3>\n<ul>\n<li>Escolher modelo errado compromete resultado</li>\n<li>Trade-off entre velocidade e qualidade</li>\n</ul>\n<h3>Solu\u00e7\u00e3o</h3>\n<pre><code>\n# Recomenda\u00e7\u00e3o:\n- Debugging r\u00e1pido: Haiku\n- Itera\u00e7\u00e3o normal: Sonnet (padr\u00e3o)\n- An\u00e1lise complexa: Opus\n</code></pre>\n<p>---</p>\n<h2>Checklist: Antes de Usar Claude Code</h2>\n<ul>\n<li>[ ] Tenho c\u00f3digo espec\u00edfico para analisar?</li>\n<li>[ ] Tarefa requer itera\u00e7\u00e3o?</li>\n<li>[ ] Contexto cabe em context window?</li>\n<li>[ ] Vou revisar output manualmente?</li>\n<li>[ ] Caso de uso apropriado?</li>\n<li>[ ] Documentei padr\u00f5es em CLAUDE.md?</li>\n</ul>\n<p>Se n\u00e3o a todas \u2192 considere alternativas.</p>\n<p>---</p>\n<p><strong>Voltar</strong>: <a href=\"01-O-QUE-E-CLAUDE-CODE.md\">O que \u00e9 Claude Code?</a></p>"}, "5": {"title": "05-HANDS-ON", "html": "<h1>Laborat\u00f3rio Pr\u00e1tico \u2014 Conceitos Fundamentais</h1>\n<p>Bem-vindo ao laborat\u00f3rio pr\u00e1tico! Este guia oferece exerc\u00edcios concretos para refor\u00e7ar cada conceito aprendido nos 4 primeiros arquivos do m\u00f3dulo. Voc\u00ea ir\u00e1 <strong>praticar intera\u00e7\u00f5es reais</strong> com Claude Code, observando Tool Use em a\u00e7\u00e3o, testando limita\u00e7\u00f5es, e validando a matriz de decis\u00e3o.</p>\n<h2>Pr\u00e9-requisitos</h2>\n<ul>\n<li>\u2705 Claude Code instalado e funcional (teste com `claude --version`)</li>\n<li>\u2705 Estar no diret\u00f3rio raiz do reposit\u00f3rio (`cd ~/Documentos/Projetos/claude-code-learning`)</li>\n<li>\u2705 ~55 minutos para a trilha completa, ou ~15 minutos para a trilha iniciante</li>\n</ul>\n<p>---</p>\n<h2>Sum\u00e1rio de Exerc\u00edcios</h2>\n<p>| # | Conceito | Exerc\u00edcio | Dificuldade | Tempo |</p>\n<p>|---|---|---|---|---|</p>\n<p>| 1.1 | 01-O-QUE-E-CLAUDE-CODE | Primeiro Contato: Tool Use | F\u00e1cil | 3 min |</p>\n<p>| 1.2 | 01-O-QUE-E-CLAUDE-CODE | CLAUDE.md na Pr\u00e1tica | M\u00e9dio | 5 min |</p>\n<p>| 1.3 | 01-O-QUE-E-CLAUDE-CODE | Claude Code vs Chat Web | M\u00e9dio | 5 min |</p>\n<p>| 2.1 | 02-CASOS-DE-USO | Debugging: Encontrando um Bug | F\u00e1cil | 4 min |</p>\n<p>| 2.2 | 02-CASOS-DE-USO | Documenta\u00e7\u00e3o Autom\u00e1tica | M\u00e9dio | 5 min |</p>\n<p>| 2.3 | 02-CASOS-DE-USO | An\u00e1lise de C\u00f3digo Legado | Dif\u00edcil | 6 min |</p>\n<p>| 3.1 | 03-QUANDO-USAR | Testando a Matriz de Decis\u00e3o | F\u00e1cil | 3 min |</p>\n<p>| 3.2 | 03-QUANDO-USAR | Contexto de Projeto Importa | M\u00e9dio | 5 min |</p>\n<p>| 3.3 | 03-QUANDO-USAR | Identificando Quando N\u00c3O Usar | Dif\u00edcil | 4 min |</p>\n<p>| 4.1 | 04-LIMITACOES | Limite de Contexto | F\u00e1cil | 4 min |</p>\n<p>| 4.2 | 04-LIMITACOES | Sem Mem\u00f3ria Entre Sess\u00f5es | M\u00e9dio | 6 min |</p>\n<p>| 4.3 | 04-LIMITACOES | Erros Silenciosos | Dif\u00edcil | 5 min |</p>\n<p>---</p>\n<h2>Trilhas de Aprendizado</h2>\n<h3>\ud83d\ude80 Trilha Iniciante (~15 min)</h3>\n<p>Para quem quer uma vis\u00e3o geral pr\u00e1tica sem aprofundamento:</p>\n<ul>\n<li><strong>1.1</strong> \u2192 Primeiro Contato (Tool Use)</li>\n<li><strong>2.1</strong> \u2192 Debugging</li>\n<li><strong>3.1</strong> \u2192 Matriz de Decis\u00e3o</li>\n<li><strong>4.1</strong> \u2192 Contexto Window</li>\n</ul>\n<p><strong>Objetivo</strong>: Sentir como Claude Code funciona e quando \u00e9 adequado usar.</p>\n<h3>\ud83d\udcda Trilha Completa (~55 min)</h3>\n<p>Para aprendizado total: execute todos os 12 exerc\u00edcios em sequ\u00eancia (1.1 \u2192 1.2 \u2192 1.3 \u2192 2.1 \u2192 ... \u2192 4.3).</p>\n<p><strong>Objetivo</strong>: Dominar cada conceito e suas nuances, incluindo limita\u00e7\u00f5es e mitiga\u00e7\u00f5es.</p>\n<p>---</p>\n<h2>Exerc\u00edcios</h2>\n<h3>1.1 \u2014 Primeiro Contato: Tool Use em A\u00e7\u00e3o</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `01-O-QUE-E-CLAUDE-CODE.md`  </p>\n<p><strong>Conceito</strong>: O Agente Claude decide usar ferramentas (Tool Use) automaticamente sem instru\u00e7\u00e3o expl\u00edcita.  </p>\n<p><strong>Dificuldade</strong>: F\u00e1cil | <strong>Tempo</strong>: ~3 min</p>\n<p>Voc\u00ea vai pedir ao Claude para ler e resumir um arquivo do reposit\u00f3rio. Observe como Claude <strong>automaticamente usa o tool `Read`</strong> para acessar o arquivo.</p>\n<p>#### Setup</p>\n<p>Voc\u00ea est\u00e1 no diret\u00f3rio raiz do reposit\u00f3rio. Nenhum arquivo precisa ser criado.</p>\n<p>#### Comando</p>\n<pre><code>\nclaude \"Leia o arquivo 01-CONCEITOS-FUNDAMENTAIS/02-CASOS-DE-USO.md e me d\u00ea um resumo de 3 linhas de cada caso de uso\"\n</code></pre>\n<p>#### Sa\u00edda Esperada</p>\n<p>Voc\u00ea ver\u00e1 algo como:</p>\n<pre><code>\nReading 01-CONCEITOS-FUNDAMENTAIS/02-CASOS-DE-USO.md...\n\n[Claude responde com um resumo de 3 linhas para cada um dos 10 casos de uso]\n</code></pre>\n<p><strong>O que observar</strong>: A mensagem `Reading ...` antes da resposta prova que Claude usou o tool `Read` automaticamente. Voc\u00ea nunca pediu explicitamente para \"usar o tool Read\" \u2014 Claude <strong>decidiu sozinho</strong> que precisava ler o arquivo para responder sua pergunta.</p>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>Este \u00e9 o fluxo fundamental do Claude Code:</p>\n<pre><code>\nSeu Prompt \u2192 Claude Agente \u2192 [Decide usar ferramentas] \u2192 Tool Use (Read) \u2192 Resultado \u2192 Resposta\n</code></pre>\n<p>\u00c0 diferen\u00e7a do Chat Web, aqui Claude age como um agente que escolhe as ferramentas certas para o trabalho.</p>\n<p>---</p>\n<h3>1.2 \u2014 CLAUDE.md na Pr\u00e1tica: Contexto Persistente</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `01-O-QUE-E-CLAUDE-CODE.md`  </p>\n<p><strong>Conceito</strong>: CLAUDE.md fornece contexto de projeto que persiste dentro da sess\u00e3o, elimina repeti\u00e7\u00e3o.  </p>\n<p><strong>Dificuldade</strong>: M\u00e9dio | <strong>Tempo</strong>: ~5 min</p>\n<p>Voc\u00ea vai fazer uma pergunta que <strong>depende do CLAUDE.md</strong> sem repetir o contexto manualmente. Claude ler\u00e1 o arquivo automaticamente.</p>\n<p>#### Setup</p>\n<p>Voc\u00ea est\u00e1 no diret\u00f3rio raiz. O arquivo `CLAUDE.md` j\u00e1 existe no reposit\u00f3rio.</p>\n<p>#### Primeiro Comando</p>\n<pre><code>\nclaude \"Leia o CLAUDE.md deste projeto e me diga: qual \u00e9 o p\u00fablico-alvo deste reposit\u00f3rio e quais s\u00e3o os 6 m\u00f3dulos que ele cont\u00e9m?\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude lista o p\u00fablico-alvo (desenvolvedores com 2+ anos de experi\u00eancia) e os 6 m\u00f3dulos (01-CONCEITOS-FUNDAMENTAIS at\u00e9 06-TROUBLESHOOTING).</p>\n<p>#### Segundo Comando (mesma sess\u00e3o)</p>\n<p>Agora, <strong>sem repetir nada do CLAUDE.md</strong>, fa\u00e7a uma pergunta que depende dele:</p>\n<pre><code>\n\"Baseado nas diretrizes de escopo do projeto, um arquivo sobre 'Boas Pr\u00e1ticas de Testes em Python' deveria estar neste reposit\u00f3rio? Por qu\u00ea?\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude responde consultando a se\u00e7\u00e3o \"What Doesn't Belong\" do CLAUDE.md: \"N\u00e3o, porque 'Boas Pr\u00e1ticas de Testes em Python' \u00e9 engenharia geral/conte\u00fado que j\u00e1 existe em milhares de lugares. O reposit\u00f3rio focam em <strong>Claude Code especificamente</strong>.\"</p>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>Na segunda pergunta, Claude <strong>j\u00e1 tinha o CLAUDE.md carregado</strong> e conseguiu responder sem que voc\u00ea precisasse repetir o contexto do projeto. Este \u00e9 o poder de CLAUDE.md:</p>\n<ul>\n<li>\u2705 <strong>Com CLAUDE.md</strong>: Contexto persiste, sem repeti\u00e7\u00e3o, decis\u00f5es r\u00e1pidas</li>\n<li>\u274c <strong>Sem CLAUDE.md</strong>: Voc\u00ea repeteria \"Este reposit\u00f3rio ensina Claude Code, modulo tal...\" a cada pergunta</li>\n</ul>\n<p>---</p>\n<h3>1.3 \u2014 Claude Code vs Chat Web: Diferen\u00e7a Concreta</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `01-O-QUE-E-CLAUDE-CODE.md` (tabela de compara\u00e7\u00e3o)  </p>\n<p><strong>Conceito</strong>: Claude Code acessa diretamente arquivos; Chat Web exige copy-paste manual.  </p>\n<p><strong>Dificuldade</strong>: M\u00e9dio | <strong>Tempo</strong>: ~5 min</p>\n<p>Voc\u00ea vai fazer a <strong>mesma pergunta de dois jeitos</strong> para sentir a diferen\u00e7a concretamente.</p>\n<p>#### Passo 1 \u2014 Simulando Chat Web (sem acesso a arquivos)</p>\n<pre><code>\nclaude \"Sem ler nenhum arquivo, apenas pelo seu conhecimento, quantos m\u00f3dulos tem este reposit\u00f3rio de aprendizado sobre Claude Code e qual \u00e9 o nome do primeiro arquivo de cada m\u00f3dulo?\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude vai admitir que n\u00e3o sabe com precis\u00e3o, ou vai chutar baseado em padr\u00f5es gen\u00e9ricos. A resposta ser\u00e1 vaga ou possivelmente incorreta.</p>\n<p><strong>Tempo</strong>: ~1 min. Anote a qualidade da resposta.</p>\n<p>#### Passo 2 \u2014 Usando Claude Code Corretamente (com acesso a arquivos)</p>\n<pre><code>\n\"Agora leia o README.md e o arquivo CLAUDE.md, depois responda com precis\u00e3o: quantos m\u00f3dulos tem este reposit\u00f3rio e qual \u00e9 o nome do primeiro arquivo de cada?\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude l\u00ea os arquivos, extrai a estrutura exata e responde:</p>\n<ul>\n<li><strong>6 m\u00f3dulos</strong>: 01-CONCEITOS-FUNDAMENTAIS, 02-ARQUITETURA, 03-COMANDOS-SINTAXE, 04-PADROES-USO, 05-CASOS-REAIS, 06-TROUBLESHOOTING</li>\n<li><strong>Primeiro arquivo de cada</strong>: 01-O-QUE-E-CLAUDE-CODE.md, 01-VISAO-GERAL.md, 01-PROMPT-BASICO.md, etc.</li>\n</ul>\n<p><strong>Tempo</strong>: ~2 min.</p>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>Compare as duas respostas:</p>\n<p>| Aspecto | Passo 1 (Chat Web) | Passo 2 (Claude Code) |</p>\n<p>|---|---|---|</p>\n<p>| <strong>Precis\u00e3o</strong> | Gen\u00e9rica, possivelmente errada | Exata, extra\u00edda diretamente |</p>\n<p>| <strong>Confian\u00e7a</strong> | \"Acho que...\"  | \"Conforme o README.md...\" |</p>\n<p>| <strong>Esfor\u00e7o</strong> | Voc\u00ea n\u00e3o fez nada | Claude usou Tool Use automaticamente |</p>\n<p>A linha da tabela de compara\u00e7\u00e3o \"<strong>Contexto de C\u00f3digo</strong>: Acesso direto a arquivos vs Copy-paste manual\" \u00e9 agora uma experi\u00eancia vivida, n\u00e3o apenas lida.</p>\n<p>---</p>\n<h3>2.1 \u2014 Debugging: Encontrando um Bug</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `02-CASOS-DE-USO.md` (Caso de Uso 1: Debugging e Investiga\u00e7\u00e3o)  </p>\n<p><strong>Conceito</strong>: Claude Code l\u00ea arquivos e faz an\u00e1lise est\u00e1tica de c\u00f3digo para identificar bugs.  </p>\n<p><strong>Dificuldade</strong>: F\u00e1cil | <strong>Tempo</strong>: ~4 min</p>\n<p>Voc\u00ea vai criar um arquivo Python com um bug intencional e pedir ao Claude para diagnosticar.</p>\n<p>#### Setup</p>\n<p>Crie um arquivo chamado `bug_exemplo.py` no diret\u00f3rio raiz do reposit\u00f3rio com este conte\u00fado:</p>\n<pre><code>\n# bug_exemplo.py\ndef calcular_media(numeros):\n    total = \"0\"  # BUG: string em vez de int\n    for n in numeros:\n        total = total + n  # Tentar\u00e1 somar string + int\n    return total / len(numeros)\n\nresultado = calcular_media([10, 20, 30])\nprint(f\"M\u00e9dia: {resultado}\")\n</code></pre>\n<p>Voc\u00ea pode criar o arquivo manualmente no editor ou via terminal:</p>\n<pre><code>\ncat > bug_exemplo.py << 'EOF'\n# bug_exemplo.py\ndef calcular_media(numeros):\n    total = \"0\"  # BUG: string em vez de int\n    for n in numeros:\n        total = total + n  # Tentar\u00e1 somar string + int\n    return total / len(numeros)\n\nresultado = calcular_media([10, 20, 30])\nprint(f\"M\u00e9dia: {resultado}\")\nEOF\n</code></pre>\n<p>#### Comando</p>\n<pre><code>\nclaude \"Analise o arquivo bug_exemplo.py. H\u00e1 um erro de tipo que causa TypeError. Identifique a linha exata do bug, explique por que causa o erro e proponha o fix correto.\"\n</code></pre>\n<p>#### Sa\u00edda Esperada</p>\n<p>Claude l\u00ea o arquivo e responde:</p>\n<pre><code>\nAnalisando bug_exemplo.py...\n\n**Linha 3**: `total = \"0\"` \u2014 inicializa total como string em vez de inteiro.\n\n**Por que causa TypeError**: Na linha 6, o c\u00f3digo tenta `total + n`, que \u00e9 \"0\" + 10. \nPython n\u00e3o permite somar string com int diretamente, causando: \n  TypeError: can only concatenate str (not \"int\") to str\n\n**Fix**: Mude a linha 3 para:\n  total = 0\n\nCom este fix, o c\u00f3digo retorna 20.0 (a m\u00e9dia correta de [10, 20, 30]).\n</code></pre>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>Este \u00e9 o <strong>Caso de Uso 1</strong>: Claude l\u00ea o arquivo Python, entende a l\u00f3gica, detecta o problema est\u00e1tico e prop\u00f5e a corre\u00e7\u00e3o. Sem Claude Code, voc\u00ea teria que:</p>\n<p>1. Copiar todo o c\u00f3digo do arquivo</p>\n<p>2. Colar no chat web</p>\n<p>3. Esperar resposta</p>\n<p>4. Copiar o c\u00f3digo corrigido de volta</p>\n<p>Com Claude Code, foi uma pergunta e pronto.</p>\n<p>---</p>\n<h3>2.2 \u2014 Documenta\u00e7\u00e3o Autom\u00e1tica</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `02-CASOS-DE-USO.md` (Caso de Uso 3: Gera\u00e7\u00e3o de Documenta\u00e7\u00e3o)  </p>\n<p><strong>Conceito</strong>: Claude Code edita arquivos in-place adicionando docstrings e type hints.  </p>\n<p><strong>Dificuldade</strong>: M\u00e9dio | <strong>Tempo</strong>: ~5 min</p>\n<p>Voc\u00ea vai criar um arquivo Python sem documenta\u00e7\u00e3o e pedir ao Claude para adicionar docstrings Google-style e type hints.</p>\n<p>#### Setup</p>\n<p>Crie `sem_docs.py`:</p>\n<pre><code>\ncat > sem_docs.py << 'EOF'\n# sem_docs.py\ndef processar_pedido(cliente_id, itens, desconto=0.0):\n    if not itens:\n        raise ValueError(\"Lista de itens vazia\")\n    subtotal = sum(item['preco'] * item['quantidade'] for item in itens)\n    total = subtotal * (1 - desconto)\n    return {\"cliente\": cliente_id, \"subtotal\": subtotal, \"total\": total}\n\ndef validar_email(email):\n    return \"@\" in email and \".\" in email.split(\"@\")[-1]\nEOF\n</code></pre>\n<p>#### Comando</p>\n<pre><code>\nclaude \"Leia sem_docs.py e adicione: (1) docstrings Google-style para cada fun\u00e7\u00e3o com Args, Returns e Raises; (2) type hints nos par\u00e2metros e retorno; (3) um coment\u00e1rio de m\u00f3dulo no topo explicando o prop\u00f3sito do arquivo.\"\n</code></pre>\n<p>#### Sa\u00edda Esperada</p>\n<p>Claude edita o arquivo <strong>in-place</strong> usando o tool `Edit`. Voc\u00ea ver\u00e1 mensagens como:</p>\n<pre><code>\nEditing sem_docs.py...\n</code></pre>\n<p>O arquivo `sem_docs.py` ser\u00e1 modificado para incluir:</p>\n<pre><code>\n\"\"\"Processamento de pedidos com valida\u00e7\u00e3o de email.\"\"\"\n\nfrom typing import Any, Dict, List\n\ndef processar_pedido(cliente_id: int, itens: List[Dict[str, Any]], desconto: float = 0.0) -> Dict[str, float]:\n    \"\"\"Processa um pedido e calcula o total com desconto.\n    \n    Args:\n        cliente_id: ID \u00fanico do cliente.\n        itens: Lista de dicion\u00e1rios com 'preco' e 'quantidade' de cada item.\n        desconto: Percentual de desconto (0.0 a 1.0). Padr\u00e3o: 0.0.\n    \n    Returns:\n        Dicion\u00e1rio com chaves 'cliente', 'subtotal' e 'total'.\n    \n    Raises:\n        ValueError: Se a lista de itens est\u00e1 vazia.\n    \"\"\"\n    if not itens:\n        raise ValueError(\"Lista de itens vazia\")\n    subtotal = sum(item['preco'] * item['quantidade'] for item in itens)\n    total = subtotal * (1 - desconto)\n    return {\"cliente\": cliente_id, \"subtotal\": subtotal, \"total\": total}\n\ndef validar_email(email: str) -> bool:\n    \"\"\"Valida se um email tem formato b\u00e1sico v\u00e1lido.\n    \n    Args:\n        email: Endere\u00e7o de email a validar.\n    \n    Returns:\n        True se o email cont\u00e9m '@' e um '.' ap\u00f3s o '@', False caso contr\u00e1rio.\n    \"\"\"\n    return \"@\" in email and \".\" in email.split(\"@\")[-1]\n</code></pre>\n<p>Voc\u00ea pode verificar a mudan\u00e7a:</p>\n<pre><code>\ncat sem_docs.py\n</code></pre>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>Este \u00e9 o <strong>Caso de Uso 3</strong>: Documenta\u00e7\u00e3o autom\u00e1tica. O arquivo foi modificado in-place sem copy-paste. Na pr\u00e1tica real, Claude Code \u00e9 especialmente \u00fatil para:</p>\n<ul>\n<li>Gerar docstrings em projetos legados sem documenta\u00e7\u00e3o</li>\n<li>Adicionar type hints a c\u00f3digo din\u00e2mico</li>\n<li>Padronizar estilo de documenta\u00e7\u00e3o</li>\n</ul>\n<p>---</p>\n<h3>2.3 \u2014 An\u00e1lise de C\u00f3digo Legado</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `02-CASOS-DE-USO.md` (Caso de Uso 8: An\u00e1lise de C\u00f3digo Legado)  </p>\n<p><strong>Conceito</strong>: Claude Code pode explicar c\u00f3digo desconhecido, identificar padr\u00f5es, apontar problemas de seguran\u00e7a.  </p>\n<p><strong>Dificuldade</strong>: Dif\u00edcil | <strong>Tempo</strong>: ~6 min</p>\n<p>Voc\u00ea vai criar um arquivo com c\u00f3digo legado (nomes obscuros, sem documenta\u00e7\u00e3o) e pedir an\u00e1lise completa.</p>\n<p>#### Setup</p>\n<p>Crie `legado.py`:</p>\n<pre><code>\ncat > legado.py << 'EOF'\nimport hashlib, time\n\n_cache = {}\n\ndef p(u, s):\n    k = hashlib.md5(f\"{u}{s}\".encode()).hexdigest()\n    if k in _cache and time.time() - _cache[k][1] < 300:\n        return _cache[k][0]\n    r = u == \"admin\" and len(s) >= 8\n    _cache[k] = (r, time.time())\n    return r\n\ndef c(d):\n    return {k: v for k, v in d.items() if v is not None and v != \"\"}\n\ndef m(u, pw, pl):\n    if not p(u, pw):\n        return None\n    return c(pl)\nEOF\n</code></pre>\n<p>#### Comando</p>\n<pre><code>\nclaude \"Leia legado.py e fa\u00e7a uma an\u00e1lise completa: (1) explique em portugu\u00eas o que cada fun\u00e7\u00e3o faz; (2) identifique qual \u00e9 o fluxo de autentica\u00e7\u00e3o; (3) aponte 2 problemas de seguran\u00e7a neste c\u00f3digo; (4) sugira nomes melhores para as fun\u00e7\u00f5es e vari\u00e1veis.\"\n</code></pre>\n<p>#### Sa\u00edda Esperada</p>\n<p>Claude fornece an\u00e1lise estruturada:</p>\n<pre><code>\nAnalisando legado.py...\n\n## Fun\u00e7\u00f5es\n\n**p(u, s)**: Fun\u00e7\u00e3o de autentica\u00e7\u00e3o com cache de 5 minutos usando MD5.\n- u: nome de usu\u00e1rio\n- s: senha\n- Retorna: True se usuario \u00e9 \"admin\" E senha tem 8+ caracteres, com cache\n\n**c(d)**: Limpa um dicion\u00e1rio removendo valores None e strings vazias.\n- d: dicion\u00e1rio a limpar\n- Retorna: novo dicion\u00e1rio sem valores falsos\n\n**m(u, pw, pl)**: Fun\u00e7\u00e3o main que autentica e limpa payload.\n- u: usu\u00e1rio\n- pw: senha\n- pl: payload\n- Retorna: payload limpo ou None se falha na autentica\u00e7\u00e3o\n\n## Fluxo de Autentica\u00e7\u00e3o\n1. m() chama p() para autenticar usu\u00e1rio e senha\n2. Se falha, retorna None\n3. Se sucede, retorna o payload limpo\n\n## Problemas de Seguran\u00e7a\n\n1. **MD5 inadequado para senhas**: O c\u00f3digo usa `hashlib.md5(f\"{u}{s}\".encode())` \n   - MD5 n\u00e3o \u00e9 adequado para hash de senhas (collision-prone, n\u00e3o \u00e9 uma fun\u00e7\u00e3o de deriva\u00e7\u00e3o de chave)\n   - Deveria usar bcrypt, scrypt ou argon2\n\n2. **Hardcoding de credencial**: `u == \"admin\"` hardcoda a credencial\n   - N\u00e3o h\u00e1 verifica\u00e7\u00e3o real de senha com hash armazenado\n   - Qualquer um que v\u00ea o c\u00f3digo sabe a credencial correta \u00e9 \"admin\"\n\n## Nomes Melhores\n\n- `p()` \u2192 `autenticar_usuario()`\n- `c()` \u2192 `limpar_payload_vazio()`\n- `m()` \u2192 `processar_login()`\n- `u` \u2192 `usuario`\n- `s` \u2192 `senha`\n- `k` \u2192 `hash_chave`\n- `r` \u2192 `autenticado`\n- `pl` \u2192 `payload`\n</code></pre>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>Este \u00e9 o <strong>Caso de Uso 8</strong>: Claude Code como \"explicador de c\u00f3digo legado\". A an\u00e1lise em um bloco coeso inclui fluxo, seguran\u00e7a e refatora\u00e7\u00e3o \u2014 o tipo de trabalho que humanos fazem horas, Claude entrega em segundos.</p>\n<p>---</p>\n<h3>3.1 \u2014 Testando a Matriz de Decis\u00e3o</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `03-QUANDO-USAR.md` (Tabela de decis\u00e3o)  </p>\n<p><strong>Conceito</strong>: Reconhecer quando Claude Code \u00e9 a ferramenta certa vs quando evitar.  </p>\n<p><strong>Dificuldade</strong>: F\u00e1cil | <strong>Tempo</strong>: ~3 min</p>\n<p>Voc\u00ea vai fazer dois prompts contrastantes e observar as respostas para validar os crit\u00e9rios de decis\u00e3o.</p>\n<p>#### Passo 1 \u2014 \u2705 Problema Adequado (com c\u00f3digo concreto)</p>\n<pre><code>\nclaude \"Este script leva 45 segundos para rodar. Otimize com processamento paralelo usando ThreadPoolExecutor:\n\ndef processar_lista(itens):\n    resultados = []\n    for item in itens:\n        import time\n        time.sleep(0.1)  # Simula opera\u00e7\u00e3o lenta\n        resultados.append(item * 2)\n    return resultados\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude produz c\u00f3digo otimizado usando `ThreadPoolExecutor`, reduzindo o tempo te\u00f3rico de 45s para ~0.5s (paralelismo). Exemplo:</p>\n<pre><code>\nfrom concurrent.futures import ThreadPoolExecutor\nimport time\n\ndef processar_lista(itens):\n    def processar_item(item):\n        time.sleep(0.1)\n        return item * 2\n    \n    with ThreadPoolExecutor(max_workers=5) as executor:\n        resultados = list(executor.map(processar_item, itens))\n    return resultados\n</code></pre>\n<p><strong>Por que \u00e9 adequado</strong>: H\u00e1 c\u00f3digo concreto para analisar e otimizar. A solu\u00e7\u00e3o \u00e9 t\u00e9cnica e iterativa.</p>\n<p>#### Passo 2 \u2014 \u274c Problema Inadequado (decis\u00e3o arquitetural)</p>\n<pre><code>\n\"Devo usar microsservi\u00e7os ou monol\u00edtico para meu novo projeto de e-commerce que tem 3 desenvolvedores e aproximadamente 1000 usu\u00e1rios por dia?\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude responde algo como:</p>\n<pre><code>\nEsta \u00e9 uma decis\u00e3o arquitetural que n\u00e3o posso responder sozinho, porque depende de fatores \nde neg\u00f3cio e organiza\u00e7\u00e3o que voc\u00ea entende melhor do que eu:\n\n- Recursos do time (3 devs \u00e9 uma restri\u00e7\u00e3o real)\n- Complexidade do escopo futuro\n- Or\u00e7amento para DevOps/infraestrutura\n- Riscos de falha\n\nRecomenda\u00e7\u00e3o: Discuta com seu time e considere:\n- Se vai crescer r\u00e1pido \u2192 microsservi\u00e7os depois\n- Se quer simplicidade inicial \u2192 monol\u00edtico agora\n</code></pre>\n<p>Claude n\u00e3o produz uma \"resposta certa\", porque n\u00e3o h\u00e1 \u2014 a decis\u00e3o depende de contexto que humanos devem discutir.</p>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>A matriz de decis\u00e3o em a\u00e7\u00e3o:</p>\n<p>| Aspecto | Passo 1 (\u2705) | Passo 2 (\u274c) |</p>\n<p>|---|---|---|</p>\n<p>| <strong>Tem c\u00f3digo?</strong> | Sim | N\u00e3o |</p>\n<p>| <strong>Itera\u00e7\u00e3o t\u00e9cnica?</strong> | Sim (otimizar) | N\u00e3o (decis\u00e3o pura) |</p>\n<p>| <strong>Resposta \u00fanica certa?</strong> | Sim (c\u00f3digo mais r\u00e1pido) | N\u00e3o (depende de contexto) |</p>\n<p>Leia novamente `03-QUANDO-USAR.md` \u2014 a linha <strong>\u2705 USE: Tem c\u00f3digo a analisar</strong> vs <strong>\u274c EVITE: Decis\u00e3o arquitetural pura</strong> acabou de se tornar intuitiva.</p>\n<p>---</p>\n<h3>3.2 \u2014 Contexto de Projeto Importa</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `03-QUANDO-USAR.md` (Crit\u00e9rio \u2705 5: Contexto de projeto importa)  </p>\n<p><strong>Conceito</strong>: A presen\u00e7a do CLAUDE.md transforma fundamentalmente a qualidade e adequa\u00e7\u00e3o da resposta.  </p>\n<p><strong>Dificuldade</strong>: M\u00e9dio | <strong>Tempo</strong>: ~5 min</p>\n<p>Voc\u00ea vai fazer a mesma tarefa <strong>duas vezes</strong>, uma sem contexto de projeto e outra com, e comparar as respostas.</p>\n<p>#### Passo 1 \u2014 Sem Contexto de Projeto</p>\n<pre><code>\nclaude \"Crie uma fun\u00e7\u00e3o Python para validar um formul\u00e1rio de cadastro com campos nome, email e idade. Inclua valida\u00e7\u00f5es b\u00e1sicas.\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude gera uma fun\u00e7\u00e3o gen\u00e9rica, funcional mas sem conhecimento do contexto educacional:</p>\n<pre><code>\nimport re\n\ndef validar_cadastro(nome, email, idade):\n    if not nome or len(nome) < 3:\n        raise ValueError(\"Nome deve ter pelo menos 3 caracteres\")\n    \n    if not re.match(r'^[\\w\\.-]+@[\\w\\.-]+\\.\\w+$', email):\n        raise ValueError(\"Email inv\u00e1lido\")\n    \n    if not isinstance(idade, int) or idade < 18:\n        raise ValueError(\"Idade deve ser >= 18\")\n    \n    return True\n</code></pre>\n<p><strong>Aspecto</strong>: C\u00f3digo correto, mas gen\u00e9rico, sem estilo educacional.</p>\n<p>#### Passo 2 \u2014 Com Contexto de Projeto (CLAUDE.md)</p>\n<p>Primeira, leia o CLAUDE.md para carregar contexto:</p>\n<pre><code>\nclaude \"Leia o CLAUDE.md deste projeto educacional sobre Claude Code. Agora, considerando este contexto, crie um exemplo de fun\u00e7\u00e3o Python para validar um formul\u00e1rio de cadastro que seria adequado como material did\u00e1tico neste reposit\u00f3rio \u2014 seguindo padr\u00f5es de estilo, coment\u00e1rios explicativos e prop\u00f3sito educacional.\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude gera uma fun\u00e7\u00e3o mais educacional:</p>\n<pre><code>\n\"\"\"Valida\u00e7\u00e3o de formul\u00e1rio de cadastro \u2014 exemplo educacional para Claude Code.\"\"\"\n\nimport re\nfrom typing import Tuple\n\ndef validar_cadastro(nome: str, email: str, idade: int) -> Tuple[bool, str]:\n    \"\"\"Valida dados de cadastro e retorna resultado com mensagem.\n    \n    Demonstra:\n    - Type hints (bom para documenta\u00e7\u00e3o em Claude Code)\n    - Mensagens de erro claras (ajuda usu\u00e1rios a entender o que est\u00e1 errado)\n    - Return tuple (padr\u00e3o simples vs exce\u00e7\u00e3o)\n    \n    Args:\n        nome: Nome completo do usu\u00e1rio.\n        email: Endere\u00e7o de email.\n        idade: Idade em anos.\n    \n    Returns:\n        Tupla (v\u00e1lido: bool, mensagem: str)\n    \"\"\"\n    # Valida\u00e7\u00e3o 1: Nome deve ter pelo menos 3 caracteres\n    if not nome or len(nome) < 3:\n        return False, \"Nome deve ter pelo menos 3 caracteres\"\n    \n    # Valida\u00e7\u00e3o 2: Email b\u00e1sico (regex simples para fins did\u00e1ticos)\n    if not re.match(r'^[\\w\\.-]+@[\\w\\.-]+\\.\\w+$', email):\n        return False, \"Email inv\u00e1lido\"\n    \n    # Valida\u00e7\u00e3o 3: Idade deve ser >= 18\n    if not isinstance(idade, int) or idade < 18:\n        return False, \"Deve ter 18 anos ou mais\"\n    \n    return True, \"Cadastro v\u00e1lido\"\n\n# Exemplo de uso\nif __name__ == \"__main__\":\n    valido, mensagem = validar_cadastro(\"Jo\u00e3o Silva\", \"joao@example.com\", 25)\n    print(f\"Resultado: {valido} \u2014 {mensagem}\")\n</code></pre>\n<p><strong>Aspecto</strong>: Mesmo c\u00f3digo base, mas com:</p>\n<ul>\n<li>Docstring explicativa sobre <strong>por que</strong> cada padr\u00e3o \u00e9 usado</li>\n<li>Coment\u00e1rios educacionais</li>\n<li>Example de uso no main</li>\n<li>Type hints vis\u00edveis</li>\n<li>Estrutura pensada para aprendizado</li>\n</ul>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>O <strong>CLAUDE.md fez diferen\u00e7a radical</strong>:</p>\n<p>| Aspecto | Passo 1 | Passo 2 |</p>\n<p>|---|---|---|</p>\n<p>| <strong>Estilo</strong> | Gen\u00e9rico, eficiente | Educacional, comentado |</p>\n<p>| <strong>P\u00fablico</strong> | Qualquer projeto | Desenvolvedores aprendendo |</p>\n<p>| <strong>Docstring</strong> | M\u00ednima | Explicativa |</p>\n<p>| <strong>Coment\u00e1rios</strong> | Nenhum | Instrucionais |</p>\n<p>Crit\u00e9rio \u2705 5 de \"Quando Usar Claude Code\": <strong>Contexto de projeto importa</strong>. Sem CLAUDE.md, Claude n\u00e3o sabe que est\u00e1 criando material educacional.</p>\n<p>---</p>\n<h3>3.3 \u2014 Identificando Quando N\u00c3O Usar</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `03-QUANDO-USAR.md` (Crit\u00e9rio \u274c 5: Modifica\u00e7\u00e3o de dados cr\u00edticos)  </p>\n<p><strong>Conceito</strong>: Claude Code se recusa ou avisa de forma muito clara quando a tarefa \u00e9 destrutiva em produ\u00e7\u00e3o.  </p>\n<p><strong>Dificuldade</strong>: Dif\u00edcil | <strong>Tempo</strong>: ~4 min</p>\n<p>Voc\u00ea vai pedir uma opera\u00e7\u00e3o destrutiva de dados cr\u00edticos e observar como Claude se comporta.</p>\n<p>#### Comando</p>\n<pre><code>\nclaude \"Temos uma tabela PostgreSQL com 50.000 usu\u00e1rios em produ\u00e7\u00e3o. Execute o seguinte SQL diretamente: DELETE FROM users WHERE last_login < '2024-01-01';\"\n</code></pre>\n<p>#### Sa\u00edda Esperada</p>\n<p>Claude <strong>n\u00e3o executa</strong> e fornece um aviso firme:</p>\n<pre><code>\n\u26a0\ufe0f AVISO DE SEGURAN\u00c7A\n\nN\u00e3o vou executar este DELETE em produ\u00e7\u00e3o sem aprova\u00e7\u00e3o expl\u00edcita e prote\u00e7\u00e3o.\nDados cr\u00edticos exigem workflow seguro:\n\n1. **Backup primeiro**\n   pg_dump -Fc proddb > backup_$(date +%Y%m%d_%H%M%S).sql\n\n2. **Verificar impacto**\n   SELECT COUNT(*) FROM users WHERE last_login < '2024-01-01';\n   \u2192 Resultado: ~X usu\u00e1rios ser\u00e3o deletados\n\n3. **Testar em staging**\n   Rode o DELETE em ambiente de staging e verifique impacto\n\n4. **Aprova\u00e7\u00e3o humana**\n   Obtenha autoriza\u00e7\u00e3o de um DBA ou arquiteto antes de produ\u00e7\u00e3o\n\n5. **Documentar**\n   Log: \"DELETE 2024-01-30: removidos usu\u00e1rios inativos pr\u00e9-2024\"\n\nComando sugerido para staging (N\u00c3O PRODU\u00c7\u00c3O):\nSELECT COUNT(*) FROM users WHERE last_login < '2024-01-01';\n-- Verifique o n\u00famero acima\n-- DELETE FROM users WHERE last_login < '2024-01-01';\n-- (comentado por seguran\u00e7a)\n</code></pre>\n<p>Claude reconhece o risco e recusa at\u00e9 ter aprova\u00e7\u00e3o expl\u00edcita.</p>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>Crit\u00e9rio \u274c 5 da matriz: <strong>\"Modifica\u00e7\u00e3o de dados cr\u00edticos \u2014 sempre requer aprova\u00e7\u00e3o manual\"</strong>.</p>\n<p>Claude Code n\u00e3o \u00e9 um \"bot\u00e3o de executar SQL\". \u00c9 uma ferramenta que ajuda voc\u00ea a <strong>pensar</strong> antes de executar \u2014 especialmente em produ\u00e7\u00e3o. A recusa \u00e9 uma feature, n\u00e3o um bug.</p>\n<p>---</p>\n<h3>4.1 \u2014 Limite de Contexto: Veja o Problema e a Solu\u00e7\u00e3o</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `04-LIMITACOES.md` (Limita\u00e7\u00e3o 1: Context Window)  </p>\n<p><strong>Conceito</strong>: Context window tem limite; a solu\u00e7\u00e3o \u00e9 focar em arquivos espec\u00edficos, n\u00e3o tentar processar tudo.  </p>\n<p><strong>Dificuldade</strong>: F\u00e1cil | <strong>Tempo</strong>: ~4 min</p>\n<p>Voc\u00ea vai fazer <strong>dois pedidos</strong> para comparar: um amplo (que sofre com limite de contexto) e um focado.</p>\n<p>#### Passo 1 \u2014 \u274c Amplo Demais</p>\n<pre><code>\nclaude \"Analise completamente todos os arquivos deste reposit\u00f3rio e me d\u00ea um resumo detalhado de cada um.\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude vai tentar mas possivelmente vai truncar, resumir demais, ou pedir para voc\u00ea delimitar o escopo. A qualidade ser\u00e1 gen\u00e9rica porque n\u00e3o consegue processar ~20k palavras simultaneamente.</p>\n<p><strong>Tempo</strong>: ~2-3 min. Anote o resultado.</p>\n<p>#### Passo 2 \u2014 \u2705 Focado</p>\n<pre><code>\nclaude \"Analise apenas os arquivos dentro de 01-CONCEITOS-FUNDAMENTAIS/ e me d\u00ea um resumo de 2-3 linhas de cada arquivo.\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude fornece resumo preciso e completo dos 4 (agora 5 com o novo 05-HANDS-ON.md) arquivos do m\u00f3dulo:</p>\n<pre><code>\n## 01-O-QUE-E-CLAUDE-CODE.md\nDefine Claude Code como ferramenta CLI/IDE, compara com Chat Web e API, apresenta 5 componentes principais (Agente, Tool Use, MCP, Hooks, CLAUDE.md) e descreve o fluxo b\u00e1sico de intera\u00e7\u00e3o.\n\n## 02-CASOS-DE-USO.md\nLista 10 casos de uso pr\u00e1ticos (debugging, refatora\u00e7\u00e3o, documenta\u00e7\u00e3o, an\u00e1lise de performance, testes, DevOps, ETL, c\u00f3digo legado, seguran\u00e7a, migra\u00e7\u00f5es) com cen\u00e1rios e prompts de exemplo.\n\n[continua...]\n</code></pre>\n<p>Comparar com o Passo 1: muito mais claro, completo e \u00fatil.</p>\n<p>#### Conceito Refor\u00e7ado</p>\n<p>A <strong>Limita\u00e7\u00e3o 1</strong> em a\u00e7\u00e3o:</p>\n<p>| Aspecto | Passo 1 (amplo) | Passo 2 (focado) |</p>\n<p>|---|---|---|</p>\n<p>| <strong>Escopo</strong> | ~20k palavras | ~3k palavras |</p>\n<p>| <strong>Qualidade</strong> | Gen\u00e9rica, truncada | Precisa, completa |</p>\n<p>| <strong>Tempo</strong> | Longo | R\u00e1pido |</p>\n<p>| <strong>Confiabilidade</strong> | M\u00e9dia | Alta |</p>\n<p><strong>Solu\u00e7\u00e3o</strong>: Delimite o escopo. Use \"apenas este diret\u00f3rio\", \"apenas este arquivo\", \"apenas essas 3 fun\u00e7\u00f5es\". Foco \u00e9 a chave.</p>\n<p>---</p>\n<h3>4.2 \u2014 Sem Mem\u00f3ria Entre Sess\u00f5es: O Problema e a Solu\u00e7\u00e3o</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `04-LIMITACOES.md` (Limita\u00e7\u00e3o 2: Sem Mem\u00f3ria Entre Sess\u00f5es)  </p>\n<p><strong>Conceito</strong>: Claude n\u00e3o lembra entre sess\u00f5es; CLAUDE.md \u00e9 a solu\u00e7\u00e3o.  </p>\n<p><strong>Dificuldade</strong>: M\u00e9dio | <strong>Tempo</strong>: ~6 min</p>\n<p>Voc\u00ea vai demonstrar o problema <strong>e</strong> a solu\u00e7\u00e3o de forma pr\u00e1tica.</p>\n<p>#### Parte 1 \u2014 Demonstrando o Problema</p>\n<p><strong>Sess\u00e3o 1</strong> (execute este comando):</p>\n<pre><code>\nclaude \"Para contexto deste projeto: estamos usando FastAPI com Python 3.12, PostgreSQL 15 e conven\u00e7\u00e3o de naming snake_case estrita com type hints obrigat\u00f3rios. Crie uma fun\u00e7\u00e3o que retorna a vers\u00e3o da API.\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude cria uma fun\u00e7\u00e3o FastAPI corretamente:</p>\n<pre><code>\nfrom fastapi import FastAPI\n\napp = FastAPI()\n\nasync def obter_versao_api() -> dict[str, str]:\n    \"\"\"Retorna a vers\u00e3o atual da API.\"\"\"\n    return {\"versao\": \"1.0.0\"}\n</code></pre>\n<p>Anote que Claude entendeu o stack (FastAPI, Python 3.12, type hints).</p>\n<p><strong>Sess\u00e3o 2</strong> (feche o Claude com Ctrl+C ou `/clear` para simular nova sess\u00e3o):</p>\n<pre><code>\nclaude \"Continue o trabalho anterior e crie agora uma fun\u00e7\u00e3o para listar usu\u00e1rios.\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude <strong>n\u00e3o lembra</strong> do stack anterior. Pode gerar:</p>\n<ul>\n<li>C\u00f3digo sem type hints</li>\n<li>Em estilo gen\u00e9rico</li>\n<li>Ou perguntar \"qual \u00e9 o stack?\"</li>\n</ul>\n<p><strong>Tempo total da Parte 1</strong>: ~3 min.</p>\n<p>#### Parte 2 \u2014 Demonstrando a Solu\u00e7\u00e3o (CLAUDE.md)</p>\n<p>Crie um arquivo `CLAUDE.md` no diret\u00f3rio raiz (se ainda n\u00e3o existe um local para testes) ou use um espec\u00edfico para este exerc\u00edcio. Por brevidade, vamos criar um em `test_claude.md`:</p>\n<pre><code>\ncat > CLAUDE.md << 'EOF'\n# Context\n\nProjeto: API de Exemplo\nStack: FastAPI, Python 3.12, PostgreSQL 15\nConven\u00e7\u00f5es: \n- snake_case obrigat\u00f3rio\n- type hints em todos os par\u00e2metros e retornos\n- docstrings Google-style\n- async/await por padr\u00e3o\nEOF\n</code></pre>\n<p>Agora, <strong>nova sess\u00e3o</strong>:</p>\n<pre><code>\nclaude \"Crie uma fun\u00e7\u00e3o para listar usu\u00e1rios da API.\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Desta vez, Claude l\u00ea automaticamente o CLAUDE.md e gera:</p>\n<pre><code>\nasync def listar_usuarios() -> list[dict[str, Any]]:\n    \"\"\"Lista todos os usu\u00e1rios da API.\n    \n    Returns:\n        Lista de dicion\u00e1rios com dados dos usu\u00e1rios.\n    \"\"\"\n    # Conex\u00e3o com PostgreSQL...\n    usuarios = await db.fetch(\"SELECT * FROM usuarios\")\n    return usuarios\n</code></pre>\n<p>O c\u00f3digo j\u00e1 segue conven\u00e7\u00f5es de FastAPI, Python 3.12, snake_case e type hints \u2014 tudo porque o CLAUDE.md estava ali.</p>\n<p>#### Conceito Refor\u00e7ado</p>\n<p><strong>Problema</strong>: Cada nova sess\u00e3o, Claude \u00e9 um \"agente novo\" sem mem\u00f3ria.  </p>\n<p><strong>Solu\u00e7\u00e3o</strong>: CLAUDE.md persiste o contexto entre sess\u00f5es automaticamente.</p>\n<p>| Sem CLAUDE.md | Com CLAUDE.md |</p>\n<p>|---|---|</p>\n<p>| Repetir stack a cada sess\u00e3o | Stack carregado automaticamente |</p>\n<p>| Inconsist\u00eancia entre respostas | Consist\u00eancia garantida |</p>\n<p>| Mais linhas no prompt | Prompt mais conciso |</p>\n<p>Este \u00e9 o motivo pelo qual todos os reposit\u00f3rios profissionais t\u00eam CLAUDE.md.</p>\n<p>---</p>\n<h3>4.3 \u2014 Erros Silenciosos: Pe\u00e7a Premissas Expl\u00edcitas</h3>\n<p><strong>Arquivo de Refer\u00eancia</strong>: `04-LIMITACOES.md` (Limita\u00e7\u00e3o 6: Erros Silenciosos)  </p>\n<p><strong>Conceito</strong>: Prompts amb\u00edguos podem levar Claude a assumir coisas erradas silenciosamente; pe\u00e7a suposi\u00e7\u00f5es expl\u00edcitas.  </p>\n<p><strong>Dificuldade</strong>: Dif\u00edcil | <strong>Tempo</strong>: ~5 min</p>\n<p>Voc\u00ea vai fazer um prompt amb\u00edguo, ver as suposi\u00e7\u00f5es perigosas que Claude faz, e depois usar a t\u00e9cnica defensiva.</p>\n<p>#### Passo 1 \u2014 Prompt Amb\u00edguo (Demonstrando o Risco)</p>\n<pre><code>\nclaude \"Crie um script para deletar arquivos antigos do servidor.\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude gera um script que <strong>assume</strong>:</p>\n<pre><code>\nimport os\nimport time\n\ndef deletar_antigos(diretorio=\"/tmp\", dias=30):\n    limite = time.time() - (dias * 86400)\n    for arquivo in os.listdir(diretorio):\n        caminho = os.path.join(diretorio, arquivo)\n        if os.path.getmtime(caminho) < limite:\n            os.remove(caminho)\n            print(f\"Deletado: {caminho}\")\n</code></pre>\n<p><strong>O problema</strong>: Quantas suposi\u00e7\u00f5es perigosas Claude fez?</p>\n<ul>\n<li>Diret\u00f3rio alvo \u00e9 `/tmp`?</li>\n<li>\"Antigo\" significa \"modificado h\u00e1 30 dias\"?</li>\n<li>Deletar permanentemente?</li>\n<li>Sem confirma\u00e7\u00e3o?</li>\n<li>Sem logging de backup?</li>\n</ul>\n<p>Se voc\u00ea executar este script, pode deletar arquivos importantes \u2014 <strong>silenciosamente</strong>.</p>\n<p>#### Passo 2 \u2014 T\u00e9cnica Defensiva (Pedir Suposi\u00e7\u00f5es Expl\u00edcitas)</p>\n<pre><code>\nclaude \"Antes de escrever qualquer c\u00f3digo, liste todas as suposi\u00e7\u00f5es que voc\u00ea est\u00e1 fazendo sobre este script de dele\u00e7\u00e3o de arquivos:\n1. Qual \u00e9 o diret\u00f3rio alvo exato?\n2. O que significa 'antigo' (data de modifica\u00e7\u00e3o? cria\u00e7\u00e3o? acesso?)?\n3. Quantos dias/meses constitui 'antigo'?\n4. Vai mover para lixeira ou deletar permanentemente?\n5. Precisa de confirma\u00e7\u00e3o do usu\u00e1rio?\n6. Precisa fazer backup antes de deletar?\n7. Precisa fazer logging das dele\u00e7\u00f5es?\"\n</code></pre>\n<p><strong>Sa\u00edda esperada</strong>: Claude lista explicitamente todas as suposi\u00e7\u00f5es:</p>\n<pre><code>\nSuposi\u00e7\u00f5es que fiz:\n1. **Diret\u00f3rio alvo**: /tmp (gen\u00e9rico, pode estar errado)\n2. **Defini\u00e7\u00e3o de antigo**: Modificado h\u00e1 30 dias (pode n\u00e3o ser o certo)\n3. **Dele\u00e7\u00e3o**: Permanente com os.remove() (sem lixeira)\n4. **Confirma\u00e7\u00e3o**: Nenhuma (perigoso!)\n5. **Backup**: Nenhum\n6. **Logging**: Apenas print (n\u00e3o persiste)\n\nPara c\u00f3digo seguro em produ\u00e7\u00e3o, voc\u00ea precisa especificar:\n- Qual \u00e9 exatamente o diret\u00f3rio que ser\u00e1 afetado?\n- Qual crit\u00e9rio de tempo (\"\u00faltimo acesso\" ou \"\u00faltima modifica\u00e7\u00e3o\")?\n- Criar um arquivo de log de dele\u00e7\u00f5es?\n- Implementar modo \"dry-run\" para preview?\n</code></pre>\n<p>Agora voc\u00ea pode corrigir as suposi\u00e7\u00f5es <strong>antes</strong> de rodar c\u00f3digo perigoso.</p>\n<p>#### Conceito Refor\u00e7ado</p>\n<p><strong>Limita\u00e7\u00e3o 6</strong>: Claude pode gerar c\u00f3digo que \"parece certo\" mas tem suposi\u00e7\u00f5es silenciosas perigosas.</p>\n<p><strong>Solu\u00e7\u00e3o</strong>: Sempre pe\u00e7a \"liste suas suposi\u00e7\u00f5es\" antes de tarefas com impacto real (dele\u00e7\u00e3o, modifica\u00e7\u00e3o de dados, infraestrutura).</p>\n<p>---</p>\n<h2>Checklist de Conclus\u00e3o</h2>\n<p>Depois de executar os exerc\u00edcios, marque os itens abaixo para confirmar que voc\u00ea dominou cada conceito:</p>\n<ul>\n<li>[ ] <strong>1.1</strong>: Observei Tool Use em a\u00e7\u00e3o (mensagem \"Reading...\" apareceu)</li>\n<li>[ ] <strong>1.2</strong>: Entendi como CLAUDE.md persiste contexto dentro da sess\u00e3o</li>\n<li>[ ] <strong>1.3</strong>: Senti concretamente a diferen\u00e7a entre acesso direto vs copy-paste manual</li>\n<li>[ ] <strong>2.1</strong>: Debuguei c\u00f3digo real com Claude identificando o erro de tipo</li>\n<li>[ ] <strong>2.2</strong>: Vi Claude editar um arquivo in-place adicionando documenta\u00e7\u00e3o</li>\n<li>[ ] <strong>2.3</strong>: Li an\u00e1lise de seguran\u00e7a completa de c\u00f3digo legado</li>\n<li>[ ] <strong>3.1</strong>: Distingui claramente quando Claude Code \u00e9 adequado vs inadequado</li>\n<li>[ ] <strong>3.2</strong>: Observei como CLAUDE.md transformou a qualidade da resposta</li>\n<li>[ ] <strong>3.3</strong>: Entendi que Claude se recusa em tarefas destrutivas sem aprova\u00e7\u00e3o</li>\n<li>[ ] <strong>4.1</strong>: Experimentei o limite de contexto e a solu\u00e7\u00e3o (foco seletivo)</li>\n<li>[ ] <strong>4.2</strong>: Demonstrei como CLAUDE.md substitui repeti\u00e7\u00e3o entre sess\u00f5es</li>\n<li>[ ] <strong>4.3</strong>: Aprendi a pedir suposi\u00e7\u00f5es expl\u00edcitas antes de c\u00f3digo perigoso</li>\n</ul>\n<p>---</p>\n<h2>Pr\u00f3ximos Passos</h2>\n<p>Parab\u00e9ns! Voc\u00ea completou o <strong>Laborat\u00f3rio Pr\u00e1tico dos Conceitos Fundamentais</strong>. Agora est\u00e1 pronto para aprender t\u00e9cnicas avan\u00e7adas:</p>\n<ul>\n<li><strong>Pr\u00f3ximo m\u00f3dulo</strong>: Leia <a href=\"../03-COMANDOS-SINTAXE/01-PROMPT-BASICO.md\">`03-COMANDOS-SINTAXE/01-PROMPT-BASICO.md`</a> para aprender sintaxe e padr\u00f5es de prompts efetivos</li>\n<li><strong>Padr\u00f5es de uso</strong>: Depois explore <a href=\"../04-PADROES-USO/01-ITERACAO-RAPIDA.md\">`04-PADROES-USO/01-ITERACAO-RAPIDA.md`</a> para t\u00e9cnicas de itera\u00e7\u00e3o e debugging com Claude Code</li>\n<li><strong>Casos reais</strong>: Quando se sentir confort\u00e1vel, veja <a href=\"../05-CASOS-REAIS/\">`05-CASOS-REAIS/`</a> para exemplos end-to-end</li>\n</ul>\n<p>---</p>\n<p><strong>Criado em</strong>: 2026-05-23  </p>\n<p><strong>Tempo total de pr\u00e1tica</strong>: ~55 minutos (trilha completa) ou ~15 minutos (trilha iniciante)</p>"}};
        let current = parseInt(new URLSearchParams(window.location.search).get('topic') || '1');
        const total = 5;

        function render(n) {
            if (!topics[n]) return;
            document.getElementById('content').innerHTML = topics[n].html;
            document.getElementById('prev-btn').href = current > 1 ? `?topic=${current - 1}` : '#';
            document.getElementById('prev-btn').classList.toggle('disabled', current === 1);
            document.getElementById('next-btn').href = current < total ? `?topic=${current + 1}` : '#';
            document.getElementById('next-btn').classList.toggle('disabled', current === total);
            window.history.replaceState({}, '', `?topic=${current}`);
        }

        document.getElementById('prev-btn').addEventListener('click', (e) => {
            if (current > 1) { current--; render(current); }
            e.preventDefault();
        });
        document.getElementById('next-btn').addEventListener('click', (e) => {
            if (current < total) { current++; render(current); }
            e.preventDefault();
        });

        render(current);
    </script>
